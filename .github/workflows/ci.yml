name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Any Fe release from 26.5.0 on is allowed for the contest.
  FE_VERSION: v26.5.0
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  verify:
    name: Fe 26.5 Contracts, Rust Solver & Web Terminal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Fe compiler (${{ env.FE_VERSION }})
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - name: Verify Fe compiler version, formatting, typecheck, tests & bytecode build
        run: |
          fe --version
          fe fmt --check
          fe check
          fe test
          fe build

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run Rust solver & MEV simulator tests
        working-directory: backend
        run: cargo test

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, test & build React + TypeScript frontend
        working-directory: frontend
        run: (if [ -f package-lock.json ]; then npm ci; else npm install; fi) && npm test && npm run build
